name: Windows tests and portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests without commercial applications
        run: python -m unittest discover -s tests -t . -v
      - name: Build portable package and verify bundled resources
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PSD-to-Spine-windows-x64
          path: dist/*.zip
          if-no-files-found: error
